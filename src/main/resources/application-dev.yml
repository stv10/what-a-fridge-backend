spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/whatafridge
    username: postgres
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

openfoodfacts:
  base-url: ${OFF_BASE_URL:https://world.openfoodfacts.org}
  contact-email: ${OFF_CONTACT_EMAIL}
